aid: kaizo
name: Kaizo
description: 'Kaizo is an AI-powered quality assurance, coaching, and performance management platform for
  customer support teams working in Zendesk and Salesforce. Its AutoQA engine automatically scores 100%
  of support conversations in real time, analyzing sentiment and empathy, generating conversation summaries,
  surfacing escalation risks, and turning support data into performance insights. AI coaching builds
  data-driven improvement roadmaps for agents, while dashboards and reporting help support leaders compare
  team and individual outcomes. Kaizo delivers its product primarily as native apps for the Zendesk
  Marketplace and Salesforce AppExchange rather than as a public developer API. The company is SOC 2
  certified, ISO 27001 certified, GDPR compliant, and continuously monitored by Secureframe. Surfaced as
  a portfolio company of Partech and added to the API Evangelist network for enrichment.'
